<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your Ember Phnom Penh account." />
    <title>Create Account | Ember Phnom Penh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="./assets/styles.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg site-nav" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand brand-wordmark" href="./index.html"><span>Ember</span><small>Phnom Penh</small></a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#emberNav" aria-controls="emberNav" aria-expanded="false" aria-label="Toggle navigation"><span class="menu-label">Menu</span><i class="bi bi-list ms-2"></i></button>
        <div class="collapse navbar-collapse" id="emberNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="./shop.html">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="./about.html">About</a></li>
            <li class="nav-item"><a class="nav-link" href="./tips.html">Candle tips</a></li>
          </ul>
          <div class="nav-actions"><a class="active-action" href="./login.html" aria-label="Sign in or create an account"><i class="bi bi-person"></i></a><a href="./cart.html" aria-label="View shopping cart"><i class="bi bi-bag"></i><span class="nav-cart-count" data-nav-cart-count hidden>0</span></a></div>
        </div>
      </div>
    </nav>

    <main class="auth-page">
      <div class="auth-shell auth-shell--signup">
        <section class="auth-visual auth-visual--signup">
          <div class="auth-visual__overlay"></div>
          <div class="auth-visual__copy">
            <p class="eyebrow text-light">Begin softly</p>
            <blockquote>Small rituals make a room feel like yours.</blockquote>
            <span>Made in Phnom Penh</span>
          </div>
        </section>
        <section class="auth-panel">
          <div class="auth-panel__inner">
            <p class="eyebrow">Join Ember</p>
            <h1>Create your account.</h1>
            <p class="auth-intro">Save a little time at checkout and keep your favorite scents close.</p>
            <form class="auth-form" data-auth-form="signup" novalidate>
              <div class="form-field"><label for="signup-name">Full name</label><input id="signup-name" name="name" type="text" autocomplete="name" required /></div>
              <div class="form-field"><label for="signup-email">Email address</label><input id="signup-email" name="email" type="email" autocomplete="email" required /></div>
              <div class="form-field"><label for="signup-password">Create password</label><input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" minlength="6" required /></div>
              <label class="check-row"><input type="checkbox" required /><span>I agree to the Terms and Privacy Policy</span></label>
              <button class="btn btn-ember w-100" type="submit">Create account <span>→</span></button>
            </form>
            <p class="auth-switch">Already have an account? <a href="./login.html">Sign in</a></p>
          </div>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="./assets/main.js"></script>
  </body>
</html>
